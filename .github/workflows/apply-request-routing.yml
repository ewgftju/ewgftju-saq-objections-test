name: Apply request routing changes

on:
  push:
    branches:
      - feature/request-routing-buttons

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/request-routing-buttons
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1. Two explicit buttons at request formation stage.
          path = "frontend/src/modules/objections/components/ConsiderationProcess.tsx"
          replace(
              path,
              '  request:\n    "Укажите адресата и срок рассмотрения. Система сформирует запрос и приложение к нему по шаблону.",',
              '  request:\n    "Выберите, куда направить запрос: в ДВГА/КВГА или в другой орган. Для запроса в ДВГА/КВГА срок рассмотрения рассчитывается автоматически.",',
          )
          replace(
              path,
              '  onAction: (action: Action, role: Role) => void;',
              '  onAction: (\n    action: Action,\n    role: Role,\n    requestMode?: "dvga-kvga" | "other",\n  ) => void;',
          )
          replace(
              path,
              '''            <Button primary onClick={() => onAction(next.action, next.role)}>
              {c.status === "received" ? "Начать рассмотрение" : next.label}
            </Button>''',
              '''            {c.status === "accepted" && next.action === "request" ? (
              <>
                <Button
                  primary
                  onClick={() => onAction("request", next.role, "dvga-kvga")}
                >
                  Сформировать запрос в ДВГА/КВГА
                </Button>
                <Button onClick={() => onAction("request", next.role, "other")}>
                  Сформировать запрос в другой орган
                </Button>
              </>
            ) : (
              <Button primary onClick={() => onAction(next.action, next.role)}>
                {c.status === "received" ? "Начать рассмотрение" : next.label}
              </Button>
            )}''',
          )

          # 2. Thread request mode through the workspace.
          path = "frontend/src/modules/objections/pages/CaseWorkspace.tsx"
          replace(
              path,
              '  onAction: (action: Action, role: Role) => void;',
              '  onAction: (\n    action: Action,\n    role: Role,\n    requestMode?: "dvga-kvga" | "other",\n  ) => void;',
          )

          # 3. Preserve the selected request kind when opening the action modal.
          path = "frontend/src/modules/objections/ObjectionsModule.tsx"
          replace(
              path,
              '  | { type: "action"; action: Action }',
              '  | {\n      type: "action";\n      action: Action;\n      requestMode?: "dvga-kvga" | "other";\n    }',
          )
          replace(
              path,
              '            onAction={(action, role) => {',
              '            onAction={(action, role, requestMode) => {',
          )
          replace(
              path,
              '              setDialog({ type: "action", action });',
              '              setDialog({ type: "action", action, requestMode });',
          )
          replace(
              path,
              '          key={`${c.id}-${dialog.action}`}\n          action={dialog.action}',
              '          key={`${c.id}-${dialog.action}-${dialog.requestMode || "default"}`}\n          action={dialog.action}\n          requestMode={dialog.requestMode}',
          )

          # 4. DVGА/KVGА form: remove "Другое" and auto-populate executor.
          path = "frontend/src/modules/objections/formDefinitions.ts"
          replace(
              path,
              'import { preparedActionValues } from "./demoForm";',
              'import { preparedActionValues } from "./demoForm";\nimport { DEMO_USER } from "../../config";',
          )
          replace(path, '  ["other", "Другое"],\n', '')
          replace(
              path,
              '''    case "request":
      title = "Сформировать запрос";
      const deadline = input(
        "deadline",
        "Срок рассмотрения",
        `${addWorkdays(date, 2)}T18:00`,
        "datetime-local",
      );
      deadline.readOnly = true;
      fields.push(
        select(
          "recipient",
          "Кому направить запрос",
          REQUEST_RECIPIENT_OPTIONS,
        ),
        deadline,
      );
      note =
        "Будут сформированы два документа: запрос и приложение к нему. Реквизиты обращения подставятся в шаблон автоматически.";
      break;''',
              '''    case "request": {
      title = "Сформировать запрос в ДВГА/КВГА";
      const deadline = input(
        "deadline",
        "Срок рассмотрения",
        `${addWorkdays(date, 2)}T18:00`,
        "datetime-local",
      );
      deadline.readOnly = true;
      const executor = input("executor", "Исполнитель", DEMO_USER.fullName);
      executor.readOnly = true;
      fields.push(
        select(
          "recipient",
          "Кому направить запрос",
          REQUEST_RECIPIENT_OPTIONS,
        ),
        deadline,
        executor,
      );
      note =
        "Будут сформированы два документа: запрос и приложение к нему. Реквизиты обращения подставятся в шаблон автоматически.";
      break;
    }''',
          )

          # 5. Separate modal UI for another authority.
          path = "frontend/src/modules/objections/components/ActionModal.tsx"
          replace(
              path,
              'import { Button, Modal, Notice } from "../../../components/ui";',
              'import { Button, Modal, Notice } from "../../../components/ui";\nimport { DEMO_USER } from "../../../config";',
          )
          replace(
              path,
              '''  action,
  c,
  date,
  onSubmit,
  onClose,
}: {
  action: Action;
  c: ObjectionCase;
  date: string;
  onSubmit: (form: FormData) => void | Promise<void>;
  onClose: () => void;
}) {''',
              '''  action,
  requestMode,
  c,
  date,
  onSubmit,
  onClose,
}: {
  action: Action;
  requestMode?: "dvga-kvga" | "other";
  c: ObjectionCase;
  date: string;
  onSubmit: (form: FormData) => void | Promise<void>;
  onClose: () => void;
}) {''',
          )
          replace(
              path,
              '''  const requestRecipient =
    values.recipient ??
    definition.fields.find((field) => field.name === "recipient")?.value ??
    "";
  const requestRecipientForPreview =
    requestRecipient === "other"
      ? values.recipientOther || ""
      : requestRecipient;
  const customRequestText =
    requestRecipient === "other" ? values.customRequestText ?? "" : undefined;''',
              '''  const isOtherRequest = action === "request" && requestMode === "other";
  const requestRecipient = isOtherRequest
    ? "other"
    : values.recipient ??
      definition.fields.find((field) => field.name === "recipient")?.value ??
      "";
  const requestRecipientForPreview = isOtherRequest
    ? values.recipientOther || ""
    : requestRecipient;
  const customRequestText = isOtherRequest
    ? values.customRequestText ?? ""
    : undefined;''',
          )
          replace(
              path,
              '      title={definition.title}',
              '      title={isOtherRequest ? "Сформировать запрос в другой орган" : definition.title}',
          )
          replace(
              path,
              '''              <div>
                <span>Автор</span>
                <b>Исполнитель</b>
              </div>
              <div>
                <span>Печатная форма</span>
                <b>Формируется по шаблону</b>
              </div>''',
              '''              <div>
                <span>Исполнитель</span>
                <b>{DEMO_USER.fullName}</b>
              </div>
              <div>
                <span>Печатная форма</span>
                <b>
                  {isOtherRequest
                    ? "Шаблон запроса в другой орган"
                    : "Шаблон запроса в ДВГА/КВГА"}
                </b>
              </div>''',
          )
          replace(
              path,
              '''            <div hidden={requestTab !== "form"} className="form-grid">
              {definition.fields.map((field) =>
                field.name === "recipient" ? (
                  <div key={field.name}>
                    <Field field={field} />
                    {requestRecipient === "other" && (
                      <>
                        <label className="field">
                          <span>Укажите адресата</span>
                          <input name="recipientOther" required />
                        </label>
                        <label className="field">
                          <span>Текст запроса</span>
                          <textarea
                            name="customRequestText"
                            rows={8}
                            required
                          />
                        </label>
                      </>
                    )}
                  </div>
                ) : (
                  <Field key={field.name} field={field} />
                ),
              )}
            </div>''',
              '''            <div hidden={requestTab !== "form"} className="form-grid">
              {isOtherRequest ? (
                <>
                  <input type="hidden" name="recipient" value="other" />
                  <label className="field">
                    <span>
                      Кому направить запрос <span className="required"> *</span>
                    </span>
                    <input
                      name="recipientOther"
                      defaultValue={values.recipientOther || ""}
                      required
                    />
                  </label>
                  <label className="field">
                    <span>
                      Текст запроса <span className="required"> *</span>
                    </span>
                    <textarea
                      name="customRequestText"
                      defaultValue={values.customRequestText || ""}
                      rows={10}
                      required
                    />
                  </label>
                </>
              ) : (
                definition.fields.map((field) => (
                  <Field key={field.name} field={field} />
                ))
              )}
            </div>''',
          )

          # 6. Print form for another authority, based on the supplied Word template.
          path = "frontend/src/modules/objections/components/DocumentModal.tsx"
          replace(
              path,
              'import { Button, Modal } from "../../../components/ui";',
              'import { Button, Modal } from "../../../components/ui";\nimport { DEMO_USER } from "../../../config";',
          )
          replace(
              path,
              'export function DocumentContent({',
              '''function executorShortName(fullName: string) {
  const [surname = "", first = "", patronymic = ""] = fullName
    .trim()
    .split(/\\s+/);
  const initials = [first, patronymic]
    .filter(Boolean)
    .map((part) => `${part[0]}.`)
    .join("");
  return `${surname} ${initials}`.trim();
}

export function DocumentContent({''',
          )
          replace(
              path,
              '''  if (kind === "request" && request)
    return (
      <article className="print-document request-template">''',
              '''  if (kind === "request" && request?.customText !== undefined)
    return (
      <article className="print-document request-template request-template-other">
        <div className="request-other-letterhead">
          <div className="request-other-ministry">
            ҚАЗАҚСТАН РЕСПУБЛИКАСЫ
            <br />
            ҚАРЖЫ МИНИСТРЛІГІ
          </div>
          <div className="request-other-emblem" aria-hidden="true">
            <span>ҚР</span>
          </div>
          <div className="request-other-ministry">
            МИНИСТЕРСТВО ФИНАНСОВ
            <br />
            РЕСПУБЛИКИ КАЗАХСТАН
          </div>
          <div className="request-other-contact">
            010000, Астана қаласы, Мәңгілік Ел даңғылы 8, 4-кіреберіс
            <br />
            тел.: +7 (7172) 75-04-71, 75-04-89, факс: 75-03-52
            <br />
            administr@minfin.gov.kz
          </div>
          <div />
          <div className="request-other-contact request-other-contact-right">
            010000, город Астана, проспект Мәңгілік Ел, 8, подъезд 4
            <br />
            тел.: +7 (7172) 75-04-71, 75-04-89, факс: 75-03-52
            <br />
            administr@minfin.gov.kz
          </div>
        </div>
        <div className="request-other-blue-line" />
        <div className="request-other-number-lines">
          <span>№ ____________________</span>
          <span>______________________</span>
        </div>
        <p className="request-template-other-recipient">
          <b>{request.recipient || "<Кому направить запрос>"}</b>
        </p>
        <p className="request-template-other-body">
          {request.customText || "<Текст запроса>"}
        </p>
        <div className="request-template-other-signature">
          <b>
            Ішкі мемлекеттік аудит
            <br />
            бойынша апелляция
            <br />
            департаментінің директоры
          </b>
          <b>Ш. Күреңбек тегі</b>
        </div>
        <p className="request-template-other-executor">
          <i>
            Орын.: {executorShortName(DEMO_USER.fullName)}
            <br />
            Тел.: 00-00-00
          </i>
        </p>
      </article>
    );

  if (kind === "request" && request)
    return (
      <article className="print-document request-template">''',
          )

          # 7. Styling for the two buttons and Word-like print form.
          path = "frontend/src/components.css"
          p = Path(path)
          css = p.read_text(encoding="utf-8")
          marker = "/* Request to another authority: Word template layout */"
          if marker not in css:
              css += '''

.consideration-task-action .button + .button {
  margin-top: 10px;
}

/* Request to another authority: Word template layout */
.request-print-preview .request-template.request-template-other {
  width: min(760px, 100%);
  min-height: 880px;
  padding: 34px 46px 62px;
}
.request-template-other {
  box-sizing: border-box;
  font-family: "Times New Roman", Times, serif;
  line-height: 1.25;
}
.request-other-letterhead {
  display: grid;
  grid-template-columns: 1fr 72px 1fr;
  gap: 8px 18px;
  align-items: center;
  color: #08649a;
  text-align: center;
}
.request-other-ministry {
  font-size: 15px;
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: .25px;
}
.request-other-emblem {
  display: grid;
  place-items: center;
  width: 62px;
  height: 62px;
  margin: 0 auto;
  border: 4px double #c59b31;
  border-radius: 50%;
  color: #c59b31;
  font-family: Georgia, serif;
  font-size: 17px;
  font-weight: 700;
  box-shadow: inset 0 0 0 2px #0b84a8;
}
.request-other-contact {
  color: #4b7c96;
  font-family: Arial, sans-serif;
  font-size: 7.5px;
  line-height: 1.25;
  text-align: left;
}
.request-other-contact-right {
  text-align: right;
}
.request-other-blue-line {
  height: 2px;
  margin: 10px 0 12px;
  background: #2f9cc3;
}
.request-other-number-lines {
  width: 38%;
  display: grid;
  gap: 6px;
  margin-bottom: 22px;
  color: #5b8ca3;
  font-family: Arial, sans-serif;
  font-size: 9px;
}
.request-template-other-recipient {
  width: 48%;
  margin: 0 0 42px auto !important;
  font-size: 17px !important;
  line-height: 1.25;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.request-template-other-body {
  min-height: 155px;
  margin: 0 0 54px !important;
  font-size: 16px !important;
  line-height: 1.35;
  text-align: left;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.request-template-other-signature {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(175px, .8fr);
  gap: 34px;
  align-items: end;
  margin-top: 42px;
  font-size: 16px;
  line-height: 1.18;
}
.request-template-other-signature b:last-child {
  text-align: right;
}
.request-template-other-executor {
  margin: 54px 0 0 !important;
  font-family: Arial, sans-serif;
  font-size: 10px !important;
  line-height: 1.2;
}
'''
              p.write_text(css, encoding="utf-8")
          PY

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit source changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-request-routing.yml
          git add frontend/src
          git commit -m "Разделить формирование запросов по адресатам"
          git push origin HEAD:feature/request-routing-buttons
